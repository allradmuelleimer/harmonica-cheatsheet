    text-transform: uppercase;
    color: var(--accent);
    font-weight: 600;

    gap: 0.6rem;
    flex-wrap: wrap;

    font-family: inherit;
    font-size: 0.9rem;
    padding: 0.4rem 0.6rem;
    color: var(--ink);
    background: var(--bg-raised);
    border: 1px solid var(--rule);
    border-radius: 6px;
    max-width: 100%;
  }

  section {
    margin-top: 2.6rem;
    padding-top: 2.6rem;
    border-top: 1px solid var(--rule);
  }
  section:first-of-type { border-top: none; padding-top: 0; }

  h2 {
    font-family: var(--sans);
    font-size: 0.78rem;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    font-weight: 600;
    color: var(--ink-soft);
    margin: 0 0 1rem;

  p { margin: 0 0 1rem; max-width: 62ch; }
  p:last-child { margin-bottom: 0; }

  ul { margin: 0 0 1rem; padding-inline-start: 1.3rem; max-width: 62ch; }
  li { margin-bottom: 0.5rem; }
  li:last-child { margin-bottom: 0; }

  .fact-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
    gap: 0.75rem;
    margin-top: 1.5rem;
  }
  .fact {
    background: var(--bg-raised);
    border-radius: 6px;
    padding: 0.9rem 1rem;
    font-family: var(--sans);
  }
  .fact .label {
    font-size: 0.68rem;
    letter-spacing: 0.06em;
    text-transform: uppercase;
    color: var(--ink-soft);
  }
  .fact .value { font-size: 0.92rem; margin-top: 0.25rem; color: var(--ink); }

  .binding-note {
    font-family: var(--sans);
    font-size: 0.82rem;

    background: var(--bg-raised);

    margin-top: 1.5rem;

        <p>

          and drawn on your device, and the app has <strong>no internet access</strong>. There is
          no developer server, no user account, no advertising and no analytics. No personal data
          is collected, stored or transmitted. The microphone is used only while practice mode is
          switched on, and nothing is recorded, stored or transmitted.
          Questions: <a href="mailto:gio_extrem@gmx.net">gio_extrem@gmx.net</a>
        </p>

/*
 * Reihenfolge des Auswahlfelds - dieselbe wie `languageMenuOrder` in der App: erst die Sprachen
 * in lateinischer Schrift alphabetisch nach ihrem Eigennamen (ohne Diakritika), dann die
 * uebrigen nach Sprachkennung. Wer seine Sprache in der App gefunden hat, findet sie hier an
 * derselben Stelle.
 */
var ORDER = ["id", "cs", "da", "de", "en", "es", "fr", "it", "nl", "nb", "pl", "pt", "fi", "sv",
             "ar", "hi", "ja", "ko", "ru", "th", "zh"];

/*
 * Dieselben Fallstricke wie in der App (LANGUAGE_ALIASES in i18n/Strings.kt): Indonesisch kommt
 * historisch als `in`, Norwegisch je nach Geraet als `no` oder `nn`. Dazu die Regionalformen,
 * die Browser liefern - `pt-BR`, `zh-Hans-CN`, `nb-NO` werden auf ihre Basis gekuerzt.
 */
var ALIASES = { "in": "id", "no": "nb", "nn": "nb", "iw": "en" };

function normalize(tag) {
  if (!tag) return null;
  var base = String(tag).toLowerCase().split("-")[0];
  if (ALIASES[base]) base = ALIASES[base];
  return T[base] ? base : null;
}

/*
 * Die Sprachwahl in der Reihenfolge ihrer Verlaesslichkeit:
 *   1. `?lang=` - das haengt die App an, wenn sie die Seite oeffnet. Sie kennt ihre eigene
 *      Anzeigesprache, und die muss nicht die Systemsprache sein.
 *   2. `#de`/`#en` - die Sprunganker der alten zweisprachigen Fassung, damit vorhandene
 *      Verweise weiter treffen.
 *   3. die Browsersprachen.
 *   4. Englisch.
 */
function pickLang() {
  var byQuery = normalize(new URLSearchParams(window.location.search).get("lang"));
  if (byQuery) return byQuery;

  var byHash = normalize(window.location.hash.replace("#", ""));
  if (byHash) return byHash;

  var list = navigator.languages || [navigator.language];
  for (var i = 0; i < list.length; i++) {
    var hit = normalize(list[i]);
    if (hit) return hit;
  }
  return "en";
}

function ul(items) {
  var out = "<ul>";
  for (var i = 0; i < items.length; i++) out += "<li>" + items[i] + "</li>";
  return out + "</ul>";
}

function paragraphs(items) {
  var out = "";
  for (var i = 0; i < items.length; i++) out += "<p>" + items[i] + "</p>";
  return out;
}

function render(code) {
  var t = T[code];
  if (!t) return;

  document.documentElement.lang = code;
  document.documentElement.dir = t.dir;
  document.title = t.title + " — Harmonica Cheatsheet";
  document.getElementById("doc-title").textContent = t.title;
  document.getElementById("doc-updated").textContent = t.updated;
  document.getElementById("doc-footer").textContent = t.footer;
  document.querySelector(".lang-pick label").textContent = t.langLabel;

  var html = "<div class=\"fact-grid\">";
  for (var f = 0; f < t.facts.length; f++) {
    html += "<div class=\"fact\"><div class=\"label\">" + t.facts[f][0] +
            "</div><div class=\"value\">" + t.facts[f][1] + "</div></div>";
  }
  html += "</div>";

  // Die Vorrangklausel steht nur ueber den neunzehn Uebersetzungen, nicht ueber DE und EN.
  if (t.binding) html += "<div class=\"binding-note\">" + t.binding + "</div>";

  for (var s = 0; s < t.sections.length; s++) {
    var sec = t.sections[s];
    html += "<section><h2>" + sec.h + "</h2>";
    /*
     * Absatz und Aufzaehlung werden in der Reihenfolge ausgegeben, in der sie im Objekt stehen.
     * Das ist kein Zufall, sondern die Absicht: Im Berechtigungsabschnitt nennt die Liste die
     * Berechtigung und der Absatz zieht daraus den Schluss ("das ist die einzige") - dort steht
     * `ul` deshalb vor `p`, ueberall sonst umgekehrt. JavaScript erhaelt die Reihenfolge der
     * Schluessel eines Objektliterals, also braucht es dafuer kein zusaetzliches Feld.
     */
    var keys = Object.keys(sec);
    for (var k = 0; k < keys.length; k++) {
      if (keys[k] === "p") html += paragraphs(sec.p);
      else if (keys[k] === "ul") html += ul(sec.ul);
    }
    html += "</section>";
  }

  document.getElementById("doc").innerHTML = html;
  document.getElementById("lang").value = code;
}

(function boot() {
  var select = document.getElementById("lang");
  for (var i = 0; i < ORDER.length; i++) {
    var code = ORDER[i];
    if (!T[code]) continue;
    var opt = document.createElement("option");
    opt.value = code;
    opt.textContent = T[code].name;
    select.appendChild(opt);
  }

  select.addEventListener("change", function () {
    render(select.value);
    // Die Wahl landet in der Adresse, damit sie ein Neuladen und ein Weitergeben ueberlebt.
    window.history.replaceState(null, "", window.location.pathname + "?lang=" + select.value);
  });

  render(pickLang());
})();
</script>
